<!DOCTYPE html>

<html lang="az"><head><title>FRERES — Səbətim</title><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary": "#ffffff", "on-tertiary-fixed-variant": "#75303b", "on-tertiary-container": "#fffbff", "on-tertiary": "#ffffff", "on-surface-variant": "#534344", "surface-container-high": "#eae7e7", "outline": "#867274", "surface-container-highest": "#e4e2e1", "background": "#fcf9f8", "surface-container": "#f0eded", "surface-variant": "#e4e2e1", "surface-bright": "#fcf9f8", "surface-container-lowest": "#ffffff", "inverse-primary": "#ffb2ba", "surface": "#fcf9f8", "primary-fixed-dim": "#ffb2ba", "tertiary-fixed-dim": "#ffb2b9", "on-surface": "#1b1c1c", "inverse-surface": "#303030", "error": "#ba1a1a", "on-primary-fixed-variant": "#75313b", "on-secondary-fixed-variant": "#005322", "tertiary-container": "#ad5d67", "primary-container": "#ac5d67", "secondary-fixed-dim": "#3de273", "on-error": "#ffffff", "secondary-fixed": "#66ff8e", "secondary": "#006d2f", "surface-container-low": "#f6f3f2", "tertiary": "#8f454f", "surface-dim": "#dcd9d9", "on-primary-container": "#fffbff", "on-secondary-container": "#007232", "primary": "#8f454f", "on-tertiary-fixed": "#3d0512", "on-primary-fixed": "#3c0512", "on-background": "#1b1c1c", "on-secondary": "#ffffff", "error-container": "#ffdad6", "inverse-on-surface": "#f3f0f0", "on-secondary-fixed": "#002109", "primary-fixed": "#ffd9dc", "outline-variant": "#d8c1c2", "surface-tint": "#924752", "on-error-container": "#93000a", "secondary-container": "#5dfd8a", "tertiary-fixed": "#ffdadc" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "1rem", "gutter-lg": "1.5rem", "space-md": "1rem", "gutter-sm": "0.75rem", "margin-md": "1.5rem", "space-xl": "2.5rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "margin": "1rem", "space-xs": "0.25rem", "margin-lg": "3rem" }, fontFamily: { "title-md": ["Inter"], "headline-lg": ["Playfair Display"], "headline-xl-mobile": ["Playfair Display"], "body-sm": ["Inter"], "body-lg": ["Inter"], "headline-lg-mobile": ["Playfair Display"], "headline-sm": ["Playfair Display"], "label-lg": ["Inter"], "label-sm": ["Inter"], "headline-xl": ["Playfair Display"], "body-md": ["Inter"], "headline-md": ["Playfair Display"], "label-md": ["Inter"] }, fontSize: { "title-md": ["16px", { lineHeight: "24px", letterSpacing: "0.01em", fontWeight: "600" }], "headline-lg": ["36px", { lineHeight: "44px", fontWeight: "500" }], "headline-xl-mobile": ["32px", { lineHeight: "40px", fontWeight: "600" }], "body-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "26px", fontWeight: "400" }], "headline-lg-mobile": ["26px", { lineHeight: "32px", fontWeight: "500" }], "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "500" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.04em", fontWeight: "600" }], "label-sm": ["10px", { lineHeight: "14px", letterSpacing: "0.08em", fontWeight: "600" }], "headline-xl": ["48px", { lineHeight: "56px", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }], "headline-md": ["24px", { lineHeight: "32px", fontWeight: "500" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.06em", fontWeight: "500" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fcf9f8;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="js/config.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/layout.js"></script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary-fixed"><script>FRERES.layout.header({ variant: "stack", title: "Səbətim" })</script><main class="flex-1 flex flex-col relative w-full pt-16 bg-surface pb-safe"><div class="flex flex-col w-full pb-10">
<div id="cart-full">
<!-- Cart Section Header -->
<div class="px-gutter pt-3 pb-1 flex items-baseline justify-between">
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm text-on-surface">Səbətiniz</span>
<span class="px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm font-semibold" id="line-count">0 məhsul</span>
</div>
</div>
<!-- Cart Items List -->
<div class="px-gutter flex flex-col gap-3 mt-2" id="cart-items"></div>
<!-- Order Calculation Summary -->
<div class="mt-4 px-gutter">
<div class="bg-surface-container-lowest p-4 rounded-xl shadow-sm flex flex-col gap-2.5">
<div class="flex justify-between items-center text-on-surface-variant font-body-md text-body-md">
<span>Məhsullar (<span id="summary-qty">0</span> ədəd)</span>
<span class="font-title-md text-title-md text-on-surface" id="summary-subtotal">0 ₼</span>
</div>
<div class="h-0.5 bg-surface-container my-1"></div>
<div class="flex justify-between items-baseline">
<span class="font-headline-sm text-headline-sm text-on-surface">Cəmi:</span>
<span class="font-headline-md text-headline-md text-primary font-bold" id="summary-total">0 ₼</span>
</div>
</div>
</div>
<!-- WhatsApp Order CTA -->
<div class="mt-5 px-gutter flex flex-col gap-3">
<a class="w-full h-12 rounded-lg bg-[#25D366] text-white font-title-md text-title-md flex items-center justify-center gap-2 shadow-sm active:scale-98 transition-all" href="#" id="wa-order" rel="noopener" target="_blank">
<span class="material-symbols-outlined text-[22px]">chat</span>
<span>WhatsApp ilə sifariş et</span>
</a>
</div>
</div>
<!-- Empty State -->
<div class="px-gutter pt-6 hidden" id="cart-empty">
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm flex flex-col items-center text-center gap-space-sm">
<span class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[24px]">shopping_bag</span></span>
<p class="font-headline-sm text-headline-sm text-on-surface">Səbətiniz boşdur</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Bəyəndiyiniz məhsulları seçin, siyahını WhatsApp ilə bizə göndərin.</p>
<a class="mt-space-xs w-full h-12 bg-primary hover:bg-tertiary text-on-primary font-title-md text-title-md rounded-lg flex items-center justify-center gap-2 shadow-md active:scale-98 transition-all" href="catalog.html">
<span class="material-symbols-outlined text-[20px]">styler</span>
<span>Kataloqa bax</span>
</a>
</div>
</div>
</div>
<script>
  (function () {
    var esc = FRERES.esc, money = FRERES.money;

    function itemHTML(it) {
      var p = it.product;
      var k = esc(it.key);
      return '<div class="bg-surface-container-lowest p-3 rounded-xl shadow-sm flex gap-3 relative overflow-hidden" data-line="' + k + '">' +
        '<a class="w-20 h-24 rounded-lg bg-surface-container overflow-hidden flex-shrink-0 relative" href="product.html?id=' + p.id + '">' +
        '<img alt="' + esc(p.name) + '" class="w-full h-full object-cover" src="' + p.img + '"/></a>' +
        '<div class="flex-1 min-w-0 flex flex-col justify-between py-0.5"><div>' +
        '<div class="flex items-start justify-between gap-1">' +
        '<h3 class="font-title-md text-title-md text-on-surface leading-tight truncate">' + esc(p.name) + "</h3>" +
        '<button aria-label="Məhsulu sil" class="w-7 h-7 -mr-1 -mt-1 flex items-center justify-center text-outline hover:text-error active:scale-90 transition-transform" data-remove="' + k + '" type="button">' +
        '<span class="material-symbols-outlined text-[18px]">delete</span></button></div>' +
        '<div class="flex items-center gap-2 mt-1">' +
        '<span class="font-body-sm text-body-sm text-on-surface-variant">Ölçü: <b class="text-on-surface font-medium">' + esc(it.size) + "</b></span>" +
        '<span class="w-1 h-1 rounded-full bg-outline-variant"></span>' +
        '<span class="font-body-sm text-body-sm text-on-surface-variant">Rəng: <b class="text-on-surface font-medium">' + esc(it.color) + "</b></span>" +
        "</div></div>" +
        '<div class="flex items-center justify-between mt-2 pt-1">' +
        '<div class="flex items-center bg-surface-container-low rounded-lg p-0.5">' +
        '<button aria-label="Sayı azalt" class="w-7 h-7 flex items-center justify-center text-on-surface hover:text-primary active:scale-95 transition-all" data-qty="' + k + '" data-delta="-1" type="button"><span class="material-symbols-outlined text-[16px]">remove</span></button>' +
        '<span class="w-6 text-center font-title-md text-title-md text-on-surface">' + it.qty + "</span>" +
        '<button aria-label="Sayı artır" class="w-7 h-7 flex items-center justify-center text-on-surface hover:text-primary active:scale-95 transition-all" data-qty="' + k + '" data-delta="1" type="button"><span class="material-symbols-outlined text-[16px]">add</span></button>' +
        "</div>" +
        '<div class="text-right"><span class="font-title-md text-title-md text-on-surface font-bold">' + money(p.price * it.qty) + "</span></div>" +
        "</div></div></div>";
    }

    function render() {
      var items = FRERES.cart.items();
      var empty = items.length === 0;
      document.getElementById("cart-full").classList.toggle("hidden", empty);
      document.getElementById("cart-empty").classList.toggle("hidden", !empty);
      if (empty) return;

      document.getElementById("cart-items").innerHTML = items.map(itemHTML).join("");
      document.getElementById("line-count").textContent = items.length + " məhsul";
      var total = FRERES.cart.total();
      document.getElementById("summary-qty").textContent = FRERES.cart.count();
      document.getElementById("summary-subtotal").textContent = money(total);
      document.getElementById("summary-total").textContent = money(total);
      document.getElementById("wa-order").href = FRERES.whatsappOrderUrl(items);
    }

    document.addEventListener("click", function (e) {
      var t;
      if ((t = e.target.closest("[data-qty]"))) {
        var key = t.getAttribute("data-qty");
        var line = FRERES.cart.items().filter(function (it) { return it.key === key; })[0];
        if (line) FRERES.cart.setQty(key, line.qty + parseInt(t.getAttribute("data-delta"), 10));
        render();
        return;
      }
      if ((t = e.target.closest("[data-remove]"))) {
        var rkey = t.getAttribute("data-remove");
        var row = t.closest("[data-line]");
        row.style.transition = "all 0.25s ease";
        row.style.opacity = "0";
        row.style.transform = "translateX(20px)";
        setTimeout(function () { FRERES.cart.remove(rkey); render(); }, 250);
      }
    });

    window.addEventListener("storage", render);
    render();
  })();
</script></main><script>FRERES.layout.whatsappFab("stack")</script></body></html>
